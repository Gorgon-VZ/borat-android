name: Build BORAT debug APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore bundled Kal_C test data
        id: kalc-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/assets/testdata
          key: kal-c-err3479086-first11300-v2

      - name: Prepare bundled Kal_C test data
        if: steps.kalc-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TMP_KALC="$RUNNER_TEMP/kalc"
          mkdir -p "$TMP_KALC" app/src/main/assets/testdata
          BASE_URL="https://ftp.sra.ebi.ac.uk/vol1/fastq/ERR347/006/ERR3479086"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$BASE_URL/ERR3479086_1.fastq.gz" \
            --output "$TMP_KALC/ERR3479086_1.fastq.gz"
          curl --fail --location --retry 4 --retry-delay 3 \
            "$BASE_URL/ERR3479086_2.fastq.gz" \
            --output "$TMP_KALC/ERR3479086_2.fastq.gz"
          python3 scripts/prepare_kalc_testdata.py \
            "$TMP_KALC/ERR3479086_1.fastq.gz" \
            "$TMP_KALC/ERR3479086_2.fastq.gz" \
            app/src/main/assets/testdata/Kal_C_test_R1.fastq.dat \
            app/src/main/assets/testdata/Kal_C_test_R2.fastq.dat

      - name: Verify bundled test data
        shell: bash
        run: |
          set -euo pipefail
          test -s app/src/main/assets/testdata/Kal_C_test_R1.fastq.dat
          test -s app/src/main/assets/testdata/Kal_C_test_R2.fastq.dat
          ls -lh app/src/main/assets/testdata/

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BORAT-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
